<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBro-Excercise - Elite AI Fitness</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-green: #ccff00;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #2a2a2a;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(204, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(204, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0; z-index: 100;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--neon-green), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-viewport {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        #input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
        #output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }

        .cam-controls { position: absolute; top: 15px; right: 15px; z-index: 10; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px; }

        .active-workout {
            background: linear-gradient(135deg, var(--card-bg) 0%, #1a1a1a 100%);
            border: 2px solid var(--neon-green);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .timer {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(204, 255, 0, 0.5);
        }

        .stat-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--neon-green);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 15px 40px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-primary { background: var(--neon-green); color: var(--dark-bg); }
        .btn:hover { box-shadow: 0 0 30px rgba(204, 255, 0, 0.5); }

        select {
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--border-color);
            padding: 10px;
            font-family: 'Rajdhani';
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <header>
        <div class="logo">IRON PUMP</div>
        <div class="timer" id="main-timer">00:00</div>
    </header>

    <div class="container">
        <div class="active-workout">
            <div class="ai-viewport">
                <video id="input_video" playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div class="cam-controls">
                    <button class="btn" id="flip-btn" style="padding: 10px 15px; font-size: 0.8rem;">FLIP CAM</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h3 style="font-family: 'Bebas Neue'; font-size: 2rem; color: var(--neon-orange);">ACTIVE TRACKING</h3>
                    <select id="exercise-select">
                        <option value="squat">SQUATS</option>
                        <option value="bicep_curl">BICEP CURLS</option>
                    </select>
                    <p id="ai-status" style="color: var(--text-secondary); font-weight: 600;">SYSTEM IDLE</p>
                </div>

                <div style="display: flex; gap: 40px;">
                    <div style="text-align: center;">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">REPS</p>
                        <div class="stat-number" id="rep-display">0</div>
                    </div>
                    <div style="text-align: center;">
                        <p style="color: var(--text-secondary); font-size: 0.8rem;">ANGLE</p>
                        <div class="stat-number" id="angle-display" style="color: white;">--</div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 30px; text-align: center; display: flex; justify-content: center; gap: 20px;">
                <button class="btn btn-primary" id="start-btn">START TRACKING</button>
                <button class="btn" id="complete-set-btn">COMPLETE & SAVE</button>
            </div>
        </div>
    </div>

    <script>
        // 1. ADD YOUR RENDER URL HERE
        const RENDER_BACKEND_URL = "https://gobro-excercise.onrender.com";

        const EX_DATA = {
            squat: { pA: 23, pB: 25, pC: 27, down: 90, up: 160, label: "Squat" },
            bicep_curl: { pA: 11, pB: 13, pC: 15, down: 45, up: 150, label: "Bicep Curl" }
        };

        let currentEx = "squat";
        let count = 0;
        let stage = "up";
        let isRunning = false;
        let timerSeconds = 0;
        
        // Default to front camera
        let facingMode = "user";

        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const repDisp = document.getElementById('rep-display');
        const angleDisp = document.getElementById('angle-display');
        const statusDisp = document.getElementById('ai-status');

        // --- MATH ---
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs((radians * 180.0) / Math.PI);
            return angle > 180 ? 360 - angle : angle;
        }

        // --- BACKEND SYNC ---
        async function saveWorkoutToRender() {
            if (count === 0) return;
            statusDisp.textContent = "UPLOADING TO RENDER...";
            try {
                const response = await fetch(`${RENDER_BACKEND_URL}/api/workouts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exercise: EX_DATA[currentEx].label,
                        reps: count,
                        timestamp: new Date().toISOString()
                    })
                });
                if (response.ok) {
                    statusDisp.textContent = "SESSION SYNCED ✅";
                }
            } catch (err) {
                console.error(err);
                statusDisp.textContent = "SYNC ERROR (Local Display Only)";
            }
        }

        // --- AI POSE LOGIC ---
        function onPoseResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const config = EX_DATA[currentEx];
                const pA = landmarks[config.pA];
                const pB = landmarks[config.pB];
                const pC = landmarks[config.pC];

                if (pA.visibility > 0.5 && pB.visibility > 0.5 && pC.visibility > 0.5) {
                    const angle = calculateAngle(pA, pB, pC);
                    angleDisp.textContent = Math.round(angle) + "°";

                    if (angle < config.down && stage === "up") {
                        stage = "down";
                        statusDisp.textContent = "REACHING BOTTOM...";
                    }
                    if (angle > config.up && stage === "down") {
                        stage = "up";
                        count++;
                        repDisp.textContent = count;
                        statusDisp.textContent = "GOOD REP!";
                    }
                }
            }
            ctx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onPoseResults);

        // --- CAMERA CONTROLS ---
        let camera = null;
        async function initCamera() {
            if (camera) {
                await camera.stop();
            }
            // Passes the facingMode variable here to control front/back lens
            camera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 640, height: 480, facingMode: facingMode
            });
            camera.start();
        }

        document.getElementById('start-btn').onclick = function() {
            if (!isRunning) {
                initCamera();
                this.textContent = "STOP TRACKING";
                isRunning = true;
                statusDisp.textContent = "AI ACTIVE";
            } else {
                location.reload();
            }
        };

        // Complete set triggers the Render save
        document.getElementById('complete-set-btn').onclick = async () => {
            await saveWorkoutToRender();
            count = 0;
            repDisp.textContent = "0";
        };

        // FLIP CAMERA LOGIC
        document.getElementById('flip-btn').onclick = () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            if(isRunning) {
                initCamera();
            }
        };

        // Change exercise resets counter
        document.getElementById('exercise-select').onchange = (e) => {
            currentEx = e.target.value;
            count = 0;
            repDisp.textContent = "0";
            statusDisp.textContent = "TRACKING: " + EX_DATA[currentEx].label.toUpperCase();
        };

        // Timer
        setInterval(() => {
            if (isRunning) {
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('main-timer').textContent = `${mins}:${secs}`;
            }
        }, 1000);
    </script>
</body>
</html>
