<!DOCTYPE html>
<html>
<head>
    <title>GoBro-Excercise</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; }
        .header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-around; align-items: center; }
        .view-container { position: relative; width: 100%; max-width: 640px; margin: 10px auto; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
        video { display: none; }
        canvas { width: 100%; height: auto; display: block; }
        
        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 640px; margin: 0 auto; }
        button { padding: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; }
        .btn-start { background: #4CAF50; color: white; }
        .btn-save { background: #2196F3; color: white; }
        .btn-flip { background: #555; color: white; grid-column: span 2; }
        
        .stats { display: flex; justify-content: space-around; padding: 20px; background: #1f1f1f; font-size: 1.5rem; }
        .stat-box span { display: block; font-size: 0.8rem; color: #888; }
        #status { color: #ffeb3b; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>WORKOUT AI</h2>
    <select id="ex-select" style="padding: 5px;">
        <option value="squat">SQUATS</option>
        <option value="bicep_curl">CURLS</option>
    </select>
</div>

<div id="status">Ready to Start</div>

<div class="view-container">
    <video id="input_video"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
</div>

<div class="stats">
    <div class="stat-box"><span id="rep-count">0</span>REPS</div>
    <div class="stat-box"><span id="angle-text">0°</span>ANGLE</div>
</div>

<div class="controls">
    <button class="btn-start" id="start-btn">START CAMERA</button>
    <button class="btn-save" id="save-btn">COMPLETE & SAVE</button>
    <button class="btn-flip" id="flip-btn">🔄 FLIP CAMERA</button>
</div>

<script>
    // --- CONFIG ---
    const RENDER_URL = "https://gobro-excercise.onrender.com";
    const EX_DATA = {
        squat: { p: [23, 25, 27], down: 90, up: 160, label: "Squat" },
        bicep_curl: { p: [11, 13, 15], down: 45, up: 150, label: "Bicep Curl" }
    };

    let currentEx = "squat";
    let reps = 0;
    let stage = "up";
    let isRunning = false;
    let facingMode = "user";

    const video = document.getElementById('input_video');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');

    // --- MATH ---
    function calcAngle(a, b, c) {
        const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs((radians * 180.0) / Math.PI);
        return angle > 180 ? 360 - angle : angle;
    }

    // --- POSE AI ---
    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
    pose.onResults((results) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        if (results.poseLandmarks) {
            const marks = results.poseLandmarks;
            const config = EX_DATA[currentEx];
            const a = marks[config.p[0]], b = marks[config.p[1]], c = marks[config.p[2]];

            if (a.visibility > 0.5 && b.visibility > 0.5 && c.visibility > 0.5) {
                const angle = calcAngle(a, b, c);
                document.getElementById('angle-text').innerText = Math.round(angle) + "°";

                if (angle < config.down && stage === "up") {
                    stage = "down";
                    document.getElementById('status').innerText = "GO UP";
                }
                if (angle > config.up && stage === "down") {
                    stage = "up";
                    reps++;
                    document.getElementById('rep-count').innerText = reps;
                    document.getElementById('status').innerText = "GOOD!";
                }
            }
        }
    });

    // --- CAMERA ENGINE ---
    let camera = null;
    async function startCam() {
        if (camera) await camera.stop();
        camera = new Camera(video, {
            onFrame: async () => await pose.send({image: video}),
            width: 640, height: 480, facingMode: facingMode
        });
        camera.start();
    }

    // --- BUTTONS ---
    document.getElementById('start-btn').onclick = () => {
        isRunning = true;
        document.getElementById('status').innerText = "AI ACTIVE";
        startCam();
    };

    document.getElementById('flip-btn').onclick = () => {
        facingMode = (facingMode === "user") ? "environment" : "user";
        if (isRunning) startCam();
    };

    document.getElementById('save-btn').onclick = async () => {
        document.getElementById('status').innerText = "SAVING...";
        try {
            await fetch(RENDER_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ exercise: currentEx, reps: reps })
            });
            document.getElementById('status').innerText = "SAVED TO RENDER ✅";
            reps = 0;
            document.getElementById('rep-count').innerText = "0";
        } catch (e) {
            document.getElementById('status').innerText = "SYNC FAILED (Check URL)";
        }
    };

    document.getElementById('ex-select').onchange = (e) => {
        currentEx = e.target.value;
        reps = 0;
        document.getElementById('rep-count').innerText = "0";
    };
</script>
</body>
</html>
