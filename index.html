<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBro-Excercise | AI Pro Trainer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .camera-container { border-radius: 2rem; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #000; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        #output_canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; }
        #input_video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .recording-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-end mb-8">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <div class="recording-dot"></div>
                    <span class="text-[10px] font-black tracking-[0.2em] text-slate-500 uppercase">AI Neural Link Active</span>
                </div>
                <h1 class="text-4xl font-black tracking-tighter text-white italic">DAILY<span class="text-blue-500">30</span></h1>
            </div>
            <div class="text-right">
                <p id="current-day" class="text-lg font-bold text-slate-400 leading-none"></p>
                <p id="current-date" class="text-[10px] font-black text-slate-600 uppercase tracking-widest mt-1"></p>
            </div>
        </header>

        <div class="grid lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8">
                <div class="camera-container border border-slate-800">
                    <video id="input_video" playsinline></video>
                    <canvas id="output_canvas"></canvas>
                    
                    <button id="flip-camera" class="absolute top-6 right-6 glass p-3 rounded-full hover:bg-blue-600/20 transition-all z-20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                    </button>

                    <div class="absolute top-6 left-6 glass p-5 rounded-3xl min-w-[150px] z-20 shadow-2xl">
                        <p id="hud-ex-name" class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">LOADING...</p>
                        <div class="flex items-baseline gap-1">
                            <span id="rep-count" class="text-7xl font-black text-white italic leading-none">0</span>
                            <span class="text-slate-500 font-bold text-xl">/ <span id="target-display">15</span></span>
                        </div>
                    </div>

                    <div class="absolute bottom-6 left-6 glass px-4 py-2 rounded-2xl z-20">
                        <p class="text-[9px] font-black text-slate-500 uppercase">Joint Angle</p>
                        <p id="angle-display" class="text-xl font-black text-blue-400 tabular-nums">---°</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div id="status-badge" class="glass w-full py-4 rounded-3xl text-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 border-blue-500/10">
                    System Standby
                </div>

                <div class="glass p-6 rounded-[2rem] space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] block mb-3">Training Protocol</label>
                        <div class="relative">
                            <select id="ex-select" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-5 py-4 text-sm font-bold text-white outline-none focus:border-blue-500 transition-all cursor-pointer">
                                </select>
                            <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-blue-500 text-xs">▼</div>
                        </div>
                        <button id="openModalBtn" class="w-full mt-3 text-[10px] font-black text-blue-500 hover:text-blue-300 uppercase tracking-widest py-2 transition-colors">
                            + New Custom Exercise
                        </button>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] block mb-3">Target Reps</label>
                        <input type="number" id="target-input" value="15" class="w-full bg-slate-900/50 border border-slate-700 rounded-2xl px-5 py-4 text-2xl font-black text-white outline-none focus:border-blue-500 transition-all">
                    </div>

                    <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-6 rounded-[2rem] font-black tracking-widest shadow-2xl shadow-blue-900/30 transition-all active:scale-95 uppercase italic text-lg">
                        Start Session
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl hidden flex items-center justify-center p-6 z-50">
        <div class="glass w-full max-w-md rounded-[3rem] p-10 shadow-2xl border-blue-500/20">
            <h2 class="text-3xl font-black mb-8 text-white italic uppercase tracking-tighter">New Protocol</h2>
            <div class="space-y-6">
                <input id="new-name" type="text" placeholder="Exercise Name (e.g. Lunges)" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-6 py-5 text-white outline-none focus:border-blue-500">
                <div class="grid grid-cols-3 gap-4">
                    <input id="new-pa" type="number" placeholder="Pt A" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 text-center text-white font-bold outline-none">
                    <input id="new-pb" type="number" placeholder="Pt B" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 text-center text-white font-bold outline-none">
                    <input id="new-pc" type="number" placeholder="Pt C" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 text-center text-white font-bold outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div>
                        <p class="text-[9px] font-black text-slate-500 uppercase mb-2">Down Angle</p>
                        <input id="new-down" type="number" placeholder="90" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-5 text-white font-bold outline-none text-center">
                    </div>
                    <div>
                        <p class="text-[9px] font-black text-slate-500 uppercase mb-2">Up Angle</p>
                        <input id="new-up" type="number" placeholder="160" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl p-5 text-white font-bold outline-none text-center">
                    </div>
                </div>
            </div>
            <div class="flex gap-6 mt-10">
                <button id="closeModalBtn" class="flex-1 text-slate-500 font-black text-xs uppercase tracking-widest">Cancel</button>
                <button id="saveExBtn" class="flex-[2] bg-blue-600 py-5 rounded-2xl font-black text-white shadow-xl shadow-blue-900/40 uppercase tracking-widest">Add Exercise</button>
            </div>
        </div>
    </div>

    <audio id="alarm-audio" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>

    <script>
        // 1. Initial Setup & Default Exercises
        const DEFAULT_MENU = {
            squat: { name: "Squats", pA: 23, pB: 25, pC: 27, down: 90, up: 160 },
            bicep_curl: { name: "Bicep Curls", pA: 11, pB: 13, pC: 15, down: 45, up: 150 },
            shoulder_press: { name: "Shoulder Press", pA: 23, pB: 11, pC: 13, down: 100, up: 160 }
        };

        let EX_MENU = JSON.parse(localStorage.getItem('DAILY30_EX')) || DEFAULT_MENU;
        
        // CRITICAL: CHANGE THIS TO YOUR ACTUAL RENDER URL BEFORE YOU PUSH
        const RENDER_URL = 'https://gobro-excercise.onrender.com'; 

        // 2. DOM Elements
        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const badge = document.getElementById('status-badge');
        const startBtn = document.getElementById('startBtn');
        const repCountDisp = document.getElementById('rep-count');
        const targetDisp = document.getElementById('target-display');
        const angleDisp = document.getElementById('angle-display');
        const hudExName = document.getElementById('hud-ex-name');
        const exSelect = document.getElementById('ex-select');

        // 3. State Variables
        let count = 0; 
        let target = 15; 
        let stage = "up"; 
        let isDone = false; 
        let currentKey = "squat";
        let currentFacingMode = "user"; // 'user' = front camera, 'environment' = back camera
        let activeCamera = null;

        // 4. UI Initializers
        function refreshExList() {
            exSelect.innerHTML = '';
            Object.keys(EX_MENU).forEach(k => {
                const opt = document.createElement('option');
                opt.value = k; 
                opt.textContent = EX_MENU[k].name.toUpperCase();
                exSelect.appendChild(opt);
            });
            hudExName.textContent = EX_MENU[currentKey].name.toUpperCase();
        }
        refreshExList();

        const d = new Date();
        document.getElementById('current-day').textContent = d.toLocaleDateString('en-US', { weekday: 'long' });
        document.getElementById('current-date').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        // 5. Core AI Math (Geometry Logic)
        function calcAngle(a, b, c) {
            const rad = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let deg = Math.abs((rad * 180.0) / Math.PI);
            return deg > 180 ? 360 - deg : deg;
        }

        // 6. Database Connection
        async function logWorkout() {
            badge.textContent = "SYNCING TO BRAIN...";
            try {
                await fetch(`${RENDER_URL}/api/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        minutes: 5, 
                        date: new Date().toISOString(), 
                        day: d.toLocaleDateString('en-US', { weekday: 'long' }) 
                    })
                });
                badge.textContent = "SYNC COMPLETE";
                badge.className = "glass w-full py-4 rounded-3xl text-center text-[10px] font-black uppercase text-green-400 border-green-500/30";
            } catch (e) { 
                badge.textContent = "SAVED TO LOCAL MEMORY"; 
            }
        }

        // 7. MediaPipe Drawing & Counting Logic
        function onResults(res) {
            if (isDone) return;
            
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);
            
            if (res.poseLandmarks) {
                const e = EX_MENU[currentKey];
                const a = res.poseLandmarks[e.pA];
                const b = res.poseLandmarks[res.poseLandmarks[e.pB] ? e.pB : 25]; // Safe fallback if point B is missing
                const c = res.poseLandmarks[e.pC];
                
                if (a && b && c && a.visibility > 0.5 && b.visibility > 0.5 && c.visibility > 0.5) {
                    const ang = calcAngle(a, b, c);
                    angleDisp.textContent = Math.round(ang) + "°";
                    
                    // Draw Professional Joint Indicator
                    ctx.fillStyle = "#3b82f6";
                    ctx.shadowBlur = 15; 
                    ctx.shadowColor = "#3b82f6";
                    ctx.beginPath();
                    ctx.arc(b.x * canvas.width, b.y * canvas.height, 8, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.shadowBlur = 0; // Reset shadow

                    // Rep Counting Engine
                    if (ang < e.down) stage = "down";
                    if (ang > e.up && stage === "down") {
                        stage = "up"; 
                        count++;
                        repCountDisp.textContent = count;
                        
                        // Goal Met Trigger
                        if (count >= target) {
                            isDone = true; 
                            document.getElementById('alarm-audio').play();
                            logWorkout();
                            startBtn.textContent = "SESSION COMPLETE";
                            startBtn.className = "w-full bg-green-600 py-6 rounded-[2rem] font-black text-white italic";
                        }
                    }
                }
            }
            ctx.restore();
        }

        // 8. Initialize MediaPipe Engine
        const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
        pose.setOptions({ 
            modelComplexity: 1, 
            smoothLandmarks: true, 
            minDetectionConfidence: 0.6, 
            minTrackingConfidence: 0.6 
        });
        pose.onResults(onResults);

        // 9. Camera Controls
        async function startCam() {
            if (activeCamera) await activeCamera.stop();
            
            activeCamera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 1280, 
                height: 720, 
                facingMode: currentFacingMode
            });
            activeCamera.start();
        }

        document.getElementById('flip-camera').onclick = () => {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (activeCamera) startCam(); // Restart with new lens
        };

        // 10. Event Listeners
        exSelect.onchange = (e) => {
            currentKey = e.target.value;
            hudExName.textContent = EX_MENU[currentKey].name.toUpperCase();
            count = 0; 
            repCountDisp.textContent = "0";
            isDone = false; // Reset completion state if changing exercises
        };

        startBtn.onclick = () => {
            target = parseInt(document.getElementById('target-input').value) || 15;
            targetDisp.textContent = target;
            count = 0;
            repCountDisp.textContent = "0";
            isDone = false;
            
            startCam();
            
            startBtn.textContent = "RECORDING LIVE";
            startBtn.className = "w-full bg-slate-800 py-6 rounded-[2rem] font-black text-slate-600 italic cursor-default";
            badge.textContent = "AI SENSORS ACTIVE";
        };

        // 11. Custom Exercise Modal Controls
        document.getElementById('openModalBtn').onclick = () => document.getElementById('modal-overlay').classList.remove('hidden');
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('modal-overlay').classList.add('hidden');
        
        document.getElementById('saveExBtn').onclick = () => {
            const name = document.getElementById('new-name').value;
            const pa = parseInt(document.getElementById('new-pa').value);
            const pb = parseInt(document.getElementById('new-pb').value);
            const pc = parseInt(document.getElementById('new-pc').value);
            const dwn = parseInt(document.getElementById('new-down').value) || 90;
            const up = parseInt(document.getElementById('new-up').value) || 160;
            
            if (name && !isNaN(pa) && !isNaN(pb) && !isNaN(pc)) {
                const k = name.toLowerCase().replace(/\s+/g, '_');
                EX_MENU[k] = { name, pA: pa, pB: pb, pC: pc, down: dwn, up: up };
                
                // Save to browser memory
                localStorage.setItem('DAILY30_EX', JSON.stringify(EX_MENU));
                
                refreshExList();
                document.getElementById('modal-overlay').classList.add('hidden');
            } else {
                alert("Please fill in the Name and Points A, B, and C.");
            }
        };
    </script>
</body>
</html>
