<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily 30 | Ultimate AI Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6 font-sans">

    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 id="current-day" class="text-2xl font-bold text-blue-400"></h1>
                <p id="current-date" class="text-slate-400 text-sm"></p>
            </div>
            <div id="status-badge" class="bg-slate-800 text-slate-400 px-4 py-1 rounded-full border border-slate-700 text-xs font-bold uppercase tracking-widest">
                Ready
            </div>
        </header>

        <div class="relative bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-800 mb-6 aspect-video">
            <video id="input_video" class="absolute inset-0 w-full h-full object-cover opacity-60" playsinline></video>
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
            
            <div class="absolute top-4 left-4 bg-slate-900/90 p-4 rounded-2xl border border-white/10 backdrop-blur-md">
                <p id="hud-exercise-name" class="text-blue-400 text-[10px] font-black uppercase tracking-widest mb-1">SQUATS</p>
                <div class="text-5xl font-black" id="rep-count">0 <span class="text-xl text-slate-500" id="target-display">/ 15</span></div>
            </div>
            
            <div class="absolute bottom-4 right-4 bg-black/50 px-3 py-1 rounded-lg border border-white/10 backdrop-blur-md">
                <p class="text-white font-mono text-sm">Angle: <span id="angle-display" class="font-bold text-blue-400">---°</span></p>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 col-span-2">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Exercise</label>
                <div class="flex items-center gap-2 mt-1">
                    <select id="exercise-select" class="bg-transparent w-full text-sm outline-none text-white font-semibold cursor-pointer">
                        </select>
                    <button id="openModalBtn" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-bold px-3 py-1 rounded-lg border border-blue-500/30 transition-all active:scale-95">
                        ➕&nbsp;ADD
                    </button>
                </div>
            </div>
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Target Reps</label>
                <input type="number" id="target-reps" value="15" class="bg-transparent w-full text-lg outline-none mt-1 text-blue-400 font-bold">
            </div>
        </div>

        <button id="startCameraBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black tracking-widest shadow-lg transition-all active:scale-95">
            START CAMERA & TRACKING
        </button>

        <audio id="alarm-audio" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-md rounded-3xl p-6 border border-slate-800 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-blue-400">Create New Exercise</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500 font-bold uppercase tracking-widest">Exercise Name</label>
                    <input id="new-ex-name" type="text" placeholder="e.g., Leg Raises" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none focus:border-blue-500">
                </div>
                
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase">Point A</label>
                        <input id="new-ex-pa" type="number" placeholder="23" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase">Point B</label>
                        <input id="new-ex-pb" type="number" placeholder="25" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase">Point C</label>
                        <input id="new-ex-pc" type="number" placeholder="27" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none">
                    </div>
                </div>
                <p class="text-[10px] text-slate-600 mt-1">*Use MediaPipe numbers (e.g., Squat = 23, 25, 27)</p>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase">Down Angle</label>
                        <input id="new-ex-down" type="number" placeholder="90" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 font-bold uppercase">Up Angle</label>
                        <input id="new-ex-up" type="number" placeholder="160" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 mt-1 text-white outline-none">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button id="closeModalBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-bold transition-all text-slate-400">Cancel</button>
                <button id="saveExerciseBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all text-white">Save Exercise</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DEFAULT EXERCISES ---
        const DEFAULT_MENU = {
            squat: { name: "Squats", pA: 23, pB: 25, pC: 27, downThreshold: 90, upThreshold: 160 },
            bicep_curl: { name: "Bicep Curls", pA: 11, pB: 13, pC: 15, downThreshold: 45, upThreshold: 150 },
            shoulder_press: { name: "Shoulder Press", pA: 23, pB: 11, pC: 13, downThreshold: 100, upThreshold: 160 }
        };

        // Load saved exercises from LocalStorage or use defaults
        let EXERCISE_MENU = JSON.parse(localStorage.getItem('myCustomWorkouts')) || DEFAULT_MENU;
        const BACKEND_URL = 'https://gobro-excercise.onrender.com';

        // Elements
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const repDisplay = document.getElementById('rep-count');
        const targetDisplay = document.getElementById('target-display');
        const angleDisplay = document.getElementById('angle-display');
        const alarmAudio = document.getElementById('alarm-audio');
        const statusBadge = document.getElementById('status-badge');
        const startBtn = document.getElementById('startCameraBtn');
        const exerciseSelect = document.getElementById('exercise-select');
        const hudExerciseName = document.getElementById('hud-exercise-name');
        const modalOverlay = document.getElementById('modal-overlay');

        // State
        let count = 0;
        let target = 15;
        let stage = "up";
        let isWorkoutComplete = false;
        let currentExerciseKey = "squat";

        // Populates the Dropdown
        function updateDropdown() {
            exerciseSelect.innerHTML = '';
            Object.keys(EXERCISE_MENU).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = EXERCISE_MENU[key].name;
                option.classList.add("bg-slate-900");
                exerciseSelect.appendChild(option);
            });
        }

        updateDropdown();

        // Date setup
        const now = new Date();
        document.getElementById('current-day').textContent = now.toLocaleDateString('en-US', { weekday: 'long' });
        document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs((radians * 180.0) / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        async function saveToRender() {
            statusBadge.textContent = "SYNCING...";
            try {
                await fetch(`${BACKEND_URL}/api/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        minutes: 5,
                        date: new Date().toISOString(),
                        day: now.toLocaleDateString('en-US', { weekday: 'long' })
                    })
                });
                statusBadge.textContent = "SAVED TO CLOUD";
                statusBadge.className = "bg-green-500/20 text-green-400 px-4 py-1 rounded-full border border-green-500/30 text-xs font-bold uppercase tracking-widest";
            } catch (err) {
                statusBadge.textContent = "SAVED LOCALLY";
            }
        }

        function onResults(results) {
            if (isWorkoutComplete) return;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const ex = EXERCISE_MENU[currentExerciseKey];
                const a = results.poseLandmarks[ex.pA];
                const b = results.poseLandmarks[ex.pB];
                const c = results.poseLandmarks[ex.pC];

                if (a && b && c && a.visibility > 0.5 && b.visibility > 0.5 && c.visibility > 0.5) {
                    const angle = calculateAngle(a, b, c);
                    angleDisplay.textContent = Math.round(angle) + "°";

                    canvasCtx.fillStyle = "#60a5fa";
                    canvasCtx.font = "bold 24px Arial";
                    canvasCtx.fillText(Math.round(angle) + "°", b.x * canvasElement.width + 15, b.y * canvasElement.height);

                    if (angle < ex.downThreshold) { stage = "down"; }
                    if (angle > ex.upThreshold && stage === "down") {
                        stage = "up";
                        count++;
                        repDisplay.innerHTML = `${count} <span class="text-xl text-slate-500">/ ${target}</span>`;
                        
                        if (count >= target) {
                            isWorkoutComplete = true;
                            alarmAudio.play();
                            saveToRender();
                            startBtn.textContent = "WORKOUT COMPLETE";
                            startBtn.className = "w-full bg-green-600 py-4 rounded-2xl font-black tracking-widest shadow-lg";
                        }
                    }
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        pose.onResults(onResults);

        exerciseSelect.onchange = (e) => {
            currentExerciseKey = e.target.value;
            hudExerciseName.textContent = EXERCISE_MENU[currentExerciseKey].name;
            count = 0;
            repDisplay.innerHTML = `0 <span class="text-xl text-slate-500">/ ${target}</span>`;
        };

        startBtn.onclick = async () => {
            target = parseInt(document.getElementById('target-reps').value);
            targetDisplay.textContent = `/ ${target}`;
            alarmAudio.play().then(() => alarmAudio.pause()).catch(e => console.log(e));
            
            const camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start();
            startBtn.textContent = "AI TRACKING ACTIVE";
            startBtn.classList.replace('bg-blue-600', 'bg-blue-900');
        };

        // --- 2. MODAL & LOCALSTORAGE LOGIC ---
        document.getElementById('openModalBtn').onclick = () => modalOverlay.classList.remove('hidden');
        document.getElementById('closeModalBtn').onclick = () => modalOverlay.classList.add('hidden');

        document.getElementById('saveExerciseBtn').onclick = () => {
            const name = document.getElementById('new-ex-name').value;
            const pA = parseInt(document.getElementById('new-ex-pa').value);
            const pB = parseInt(document.getElementById('new-ex-pb').value);
            const pC = parseInt(document.getElementById('new-ex-pc').value);
            const downThreshold = parseInt(document.getElementById('new-ex-down').value);
            const upThreshold = parseInt(document.getElementById('new-ex-up').value);

            if (name && pA && pB && pC && downThreshold && upThreshold) {
                // Generate a safe unique key
                const key = name.toLowerCase().replace(/\s+/g, '_');
                
                // Add to our global object
                EXERCISE_MENU[key] = { name, pA, pB, pC, downThreshold, upThreshold };
                
                // Save to LocalStorage so it stays after a refresh!
                localStorage.setItem('myCustomWorkouts', JSON.stringify(EXERCISE_MENU));
                
                // Refresh dropdown and close
                updateDropdown();
                modalOverlay.classList.add('hidden');
                alert(`${name} has been added to your menu!`);
            } else {
                alert("Please fill in all fields correctly.");
            }
        };
    </script>
</body>
</html>
